# Unitree G1 Configuration
# Copy to config_local.yaml and modify for your setup

# Robot configuration
robot:
  num_motors: 29              # 29 (body only) or 43 (body + Dex3 hands)
  fix_base: true              # true for suspended/gantry, false for free-standing
  enable_elastic_band: true   # Virtual gantry in simulation

# DDS Communication
dds:
  domain_sim: 1               # Domain ID for simulation (avoids conflict with real robot on domain 0)
  domain_real: 0              # Domain ID for real robot
  interface_sim: "lo"         # Loopback for sim on same machine
  interface_real: "Ethernet"  # Your ethernet interface (e.g., "eth0", "enp2s0")

# Control frequencies
control:
  physics_freq: 500           # Hz - MuJoCo simulation step rate
  policy_freq: 50             # Hz - Policy inference rate
  control_freq: 500           # Hz - Motor command rate (hardware)

# Safety limits
safety:
  max_joint_velocity: 1.2     # rad/s
  max_joint_acceleration: 10.0 # rad/s^2
  max_torque: 100.0           # Nm
  fall_height_threshold: 0.45 # m - trigger emergency stop if base height below this
  joint_limit_margin: 0.03    # rad - margin from hard limits

# Default PD gains (can be overridden per-policy)
gains:
  body_kp: 60.0
  body_kd: 1.5
  hand_kp: 20.0
  hand_kd: 0.5

# Simulation settings
simulation:
  timestep: 0.002
  gravity: [0, 0, -9.81]
  elastic_band_stiffness: 5000.0
  elastic_band_damping: 100.0
  elastic_band_height: 0.793

# Real robot settings
hardware:
  auto_release_motion_mode: true
  wait_for_robot_timeout: 5.0
  arm_sdk_enable_delay: 0.2
  crc_enabled: true

# Logging
logging:
  level: "INFO"
  log_dir: "logs"
  save_trajectories: true
  trajectory_dir: "trajectories"

# Policy settings
policy:
  default_policy: "stand"
  checkpoint_dir: "models"
  onnx_models_dir: "models/onnx"