[project]
name = "unitree-g1"
version = "0.2.0"
description = "Clean, high-performance simulation and control framework for the Unitree G1 humanoid robot in MuJoCo"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "mujoco>=3.1.0",
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.0",
    "pytest>=8.0.0",
]
train = [
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.2.0",
]
